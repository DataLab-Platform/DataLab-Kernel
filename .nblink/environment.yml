name: datalab-environment
channels:
  - https://prefix.dev/emscripten-forge-4x
  - https://prefix.dev/conda-forge
dependencies:
  # Compiled packages, taken from emscripten-forge for this runtime.
  - xeus-python
  - numpy
  - scipy
  - scikit-image
  - pandas <3.1  # Sigima 1.4 requirement
  - pywavelets
  - h5py
  - matplotlib-base
  # Pure-Python dependencies, also listed for tools installing pip packages
  # without their dependencies (jupyterlite-xeus).
  - guidata >=3.17
  - httpx
  - makefun
  - packaging
  - plotly
  - micropip
  # The conda-forge Sigima package requires imagecodecs, which emscripten-forge
  # does not provide; Sigima's PyPI metadata excludes it on Emscripten.
  - pip:
      - sigima
      - datalab-kernel
